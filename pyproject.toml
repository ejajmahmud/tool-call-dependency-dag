[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-dependency-dag"
version = "0.1.0"
description = "Directed acyclic graph scheduler resolving parameter dependencies among parallel tool calls for topological execution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
tool-call-dependency-dag = "tool_call_dependency_dag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_call_dependency_dag*"]
